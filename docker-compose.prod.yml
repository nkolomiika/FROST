# Прод-оверрайд поверх docker-compose.yml. Применяется вторым -f:
#   ENV_FILE=.env.prod docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Проще — ./deploy.sh (он же экспортирует CERT_IP/CERT_HOST для nginx).
#
# Что меняет относительно дева:
#   • backend без --reload (dev-watcher в проде не нужен);
#   • restart: unless-stopped на всех сервисах — переживают ребут сервера;
#   • nginx получает адрес для SAN самоподписанного сертификата.
# Окружение (origins, APP_BASE_URL, DEBUG, SMTP…) приходит из .env.prod через
# ENV_FILE — здесь его не дублируем.
#
# Внутренние порты (8000/9000/9001/5433/1025/8025) в базовом compose
# публикуются на 0.0.0.0. Здесь они переопределяются на 127.0.0.1: docker
# правит iptables напрямую и проходит мимо UFW/ufw-allow-листа, так что
# «закрыть фаерволом» на самом хосте не работает — публиковать надо только
# на loopback. Наружу светит лишь nginx (80/443); до Swagger, MinIO-консоли,
# postgres и mailpit добираются SSH-туннелем.
#   ssh -L 8000:127.0.0.1:8000 root@<server>

# Лимиты памяти на контейнеры. mem_limit — ПОТОЛОК: контейнер убивается только если
# ВЫШЕЛ за свой лимит, healthy-контейнеры он не трогает, память не резервирует. Поэтому
# щедрые дефолты безопасны — они лишь ловят распухание (главный риск — recon-worker:
# nmap/ffuf/katana/trufflehog + JS-бюджет). Значения переопределяются из .env.prod
# (MEM_RECON, MEM_BACKEND, …) под RAM конкретной машины.
services:
  backend:
    restart: unless-stopped
    mem_limit: ${MEM_BACKEND:-1g}
    ports: !override
      - "127.0.0.1:8000:8000"

  mail-worker:
    restart: unless-stopped
    mem_limit: ${MEM_MAIL:-256m}

  recon-worker:
    restart: unless-stopped
    mem_limit: ${MEM_RECON:-2g}

  report-sidecar:
    restart: unless-stopped
    mem_limit: ${MEM_SIDECAR:-512m}

  frontend:
    restart: unless-stopped
    # Базовый compose запускает `npm install && npm run dev`: в деве это удобно —
    # правка package.json подхватывается без пересборки образа. В проде зависимости
    # уже установлены на этапе сборки, а повторный npm install поверх анонимного
    # volume /app/node_modules падает с ENOTEMPTY и загоняет контейнер в restart-loop.
    command: npm run dev
    mem_limit: ${MEM_FRONTEND:-1g}

  db:
    restart: unless-stopped
    mem_limit: ${MEM_DB:-1g}
    # Дефолтные user/password из базового compose — для дева. В проде
    # пароль приходит из .env.prod (deploy.sh экспортирует его для интерполяции).
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env.prod}
    ports: !override
      - "127.0.0.1:5433:5432"

  minio:
    restart: unless-stopped
    mem_limit: ${MEM_MINIO:-768m}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER не задан в .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан в .env.prod}
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  rabbitmq:
    restart: unless-stopped
    mem_limit: ${MEM_RABBIT:-512m}

  mailpit:
    restart: unless-stopped
    mem_limit: ${MEM_MAILPIT:-128m}
    ports: !override
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  nginx:
    restart: unless-stopped
    mem_limit: ${MEM_NGINX:-256m}
    # Только 443. :80 (redirect на https) и :3000 (дев-привычка) наружу не
    # публикуем — на этой машине 80 занят посторонним сервисом. Следствие:
    # http://<адрес> не отвечает, адрес надо набирать с https:// явно.
    ports: !override
      - "443:443"
    # Адрес для SAN сертификата (deploy.sh экспортирует из .env.prod).
    environment:
      CERT_IP: ${CERT_IP:-}
      CERT_HOST: ${CERT_HOST:-}

# MTU compose-сети. Docker создаёт user-defined bridge с MTU 1500 и НЕ наследует
# `mtu` из daemon.json, поэтому хостинг, где реальный path MTU ниже, а ICMP
# "fragmentation needed" режется, даёт blackhole: мелкие ответы проходят,
# крупные (метаданные npm, тарболлы, apt) виснут в таймаут. Значение берётся из
# .env.prod; 1500 — обычный случай, снижать только если наблюдается такой симптом.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1500}
