services:
  backend:
    build:
      context: ./backend-go
      target: runtime
      args:
        CMD: api
    # Go-API: сам применяет goose-миграции и создаёт стартового админа на старте.
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      COOKIE_SECURE: "true"
      REPORTS_SIDECAR_URL: "http://report-sidecar:8100"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      report-sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mail-worker:
    build:
      context: ./backend-go
      target: runtime
      args:
        CMD: mail-worker
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Рекон-ферма: пробив вставленных списков хостов/IP отдельным процессом.
  recon-worker:
    build:
      context: ./backend-go
      target: recon
      args:
        CMD: recon-worker
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy

  # Python-sidecar генерации Word-отчётов (интерим Go-миграции): Go-API дёргает
  # его по внутренней сети. Переиспользует образ backend (word_builder + шаблоны).
  report-sidecar:
    build:
      context: ./backend
    command: uvicorn app.report_sidecar:app --host 0.0.0.0 --port 8100
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8100"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev"
    # Not exposed on the host directly; nginx fronts it (see the nginx service).
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcf
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pcf"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_ERLANG_COOKIE: pcf_rabbitmq_dev_cookie_1234567890
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/99-local.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # TLS-terminating reverse proxy: 80 -> 301 https, 443 -> app.
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gen-cert.sh:/docker-entrypoint.d/10-gen-cert.sh:ro
      # Персист self-signed серта между пересозданиями контейнера: без этого
      # каждый `deploy.sh recreate` генерит НОВЫЙ серт, и браузер теряет доверие
      # (XHR к /api рвутся → «Server unavailable»), пока пользователь не примет
      # серт заново. С volume серт стабилен между деплоями.
      - nginx-certs:/etc/nginx/certs

volumes:
  pgdata:
  miniodata:
  nginx-certs:
